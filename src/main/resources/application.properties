spring.application.name=EvenTicket

server.port=80
# Base de datos MySQL Local
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/eventicket?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=eventicket_app
spring.datasource.password=${EVENTICKET_DB_PASSWORD:Eventicket_Local_2026.}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
